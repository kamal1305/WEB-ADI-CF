<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Panel de administración para A.D. Icovesa" />
  <title>Panel de Administración - A.D. Icovesa</title>
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-primary: #1f2937;
      --color-secondary: #6366f1;
      --color-accent: #f59e0b;
      --color-success: #10b981;
      --color-error: #ef4444;
      --color-bg: #ffffff;
      --color-bg-secondary: #f9fafb;
      --color-border: #e5e7eb;
      --color-text: #111827;
      --color-text-secondary: #6b7280;
      --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
      --spacing-1: 4px;
      --spacing-2: 8px;
      --spacing-3: 12px;
      --spacing-4: 16px;
      --spacing-5: 20px;
      --spacing-6: 24px;
      --spacing-8: 32px;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--color-text);
      background: var(--color-bg-secondary);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #cms {
      flex: 1;
    }

    /* Estilos para el panel de Decap CMS */
    [class*="ControlPanel"],
    [class*="Sidebar"],
    [class*="Header"] {
      font-family: inherit !important;
    }

    /* Smooth transitions para interactividad */
    button, a, input, [role="button"] {
      transition: all 0.2s var(--transition-smooth);
    }

    /* Asegura que Decap CMS se vea bien */
    [class*="EditorLayout"] {
      background: var(--color-bg) !important;
    }

    /* Estados focus para accesibilidad */
    *:focus-visible {
      outline: 2px solid var(--color-secondary);
      outline-offset: 2px;
    }

    /* Scrollbar elegante */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--color-border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--color-text-secondary);
    }

    /* Loading state elegante */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    [class*="Loading"] {
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body>
  <div id="cms"></div>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
